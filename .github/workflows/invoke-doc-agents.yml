name: Invoke Documentation Agent

on:
  workflow_dispatch:
    inputs:
      agent:
        description: 'Target Agent'
        required: true
        type: choice
        options:
          - frontend-doc
          - backend-doc
          - infra-doc
          - readme
          - contributing
      instruction:
        description: 'Instruction for the agent'
        required: true
        default: '指定されたドキュメントの作成または更新を行ってください。'
        type: string

permissions:
  issues: write
  contents: read

jobs:
  create_issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Issue for Copilot Agent
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_PAT }}
          AGENT: ${{ inputs.agent }}
          INSTRUCTION: ${{ inputs.instruction }}
        run: |
          TITLE="[Docs] 指定されたドキュメントの作成または更新 via @$AGENT"
          BODY="$INSTRUCTION @copilot @$AGENT プルリクエストのタイトルと説明は日本語で作成してください。"
          
          
          ISSUE_URL=$(gh issue create \
            --title "$TITLE" \
            --body "$BODY")
          
          echo "Created issue: $ISSUE_URL"
          echo "Waiting for 5 seconds before assigning to trigger agent..."
          sleep 5    
          
          gh issue edit "$ISSUE_URL" --add-assignee "@copilot"
